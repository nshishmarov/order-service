databaseChangeLog:
  - changeSet:
      id: create_orders_seq
      author: nikita
      changes:
        - createSequence:
            sequenceName: orders_seq
            startValue: 1
            incrementBy: 1
  - changeSet:
      id: 1
      author: nikita
      changes:
        - createTable:
            tableName: orders
            columns:
              - column:
                  name: orderId
                  type: bigint
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: orderName
                  type: char(100)
                  constraints:
                    nullable: false
              - column:
                  name: orderDate
                  type: date
                  constraints:
                    nullable: false